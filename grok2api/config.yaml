name: "Grok2API"
version: "3.1.8"
slug: "grok2api"
description: "OpenAI-compatible API gateway for Grok Web Chat sessions (Grok2API packaged for Home Assistant OS)"
url: "https://github.com/chenyme/grok2api"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: true
webui: "http://[HOST]:[PORT:8000]/"
watchdog: "http://[HOST]:[PORT:8000]/healthz"
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "OpenAI-compatible API (/v1), admin API (/api/admin/v1) and Web UI"
options:
  admin_username: "admin"
  admin_password: ""
  bootstrap_client_key: true
  client_key_name: "Home Assistant"
  request_timeout: 600
  public_base_url: ""
schema:
  admin_username: str
  admin_password: password
  bootstrap_client_key: bool?
  client_key_name: str?
  request_timeout: int(30,7200)?
  public_base_url: str?
